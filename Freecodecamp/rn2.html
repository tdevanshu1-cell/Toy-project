<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="style.css">

</head>

<body style="height: 100vh;background-color: rgb(43, 226, 156);">
    <main id="playing-cards" style="display: flex; align-items: center; justify-content: center;">
        <div class="card" style="font-size: 30px;background-color: whitesmoke;color: red;">
            <div class="left"> 
                <span>A</span>
                <span>♥</span>
        </div>
        <div class="middle">
                <span>♥</span>
            </div>
            <div class="right"> 
                <span>A</span>
                <span>♥</span>
            </div>
        </div>
        <div class="card" style="font-size: 30px;background-color: whitesmoke;">
            <div class="left"> 
                <span>A</span>
                <span>♣</span>
        </div>
        <div class="middle">
                <span>♣</span>
            </div>
            <div class="right"> 
                <span>A</span>
                <span>♣</span>
            </div>
        </div>
        <div class="card" style="font-size: 30px;background-color: whitesmoke;">
            <div class="left"> 
                <span>A</span>
                <span>♠</span>
        </div>
        <div class="middle">
                <span>♠</span>
            </div>
            <div class="right"> 
                <span>A</span>
                <span>♠</span>
            </div>
        </div>

    </main>
  

</body>

</html>
